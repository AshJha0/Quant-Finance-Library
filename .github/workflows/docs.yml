name: Docs

on:
  push:
    branches: [main]
    # No tag trigger: the github-pages environment deploys from main only, and
    # the release merge to main already publishes the same site.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Publish the API docs of the newest release, not the SNAPSHOT on main.
      # docs/index.html is still taken from the triggering commit.
      - name: Check out latest release tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$tag" ]; then
            echo "no release tag found, building docs from $GITHUB_SHA"
          else
            echo "building API docs from $tag"
            cp docs/index.html "$RUNNER_TEMP/index.html"
            git checkout --quiet "$tag"
            cp "$RUNNER_TEMP/index.html" docs/index.html
          fi
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate javadoc
        run: ./mvnw -B --no-transfer-progress -DskipTests -Djacoco.skip=true package
      - name: Assemble site
        run: |
          mkdir -p _site/api
          cp docs/index.html _site/
          # one javadoc tree per artifact: api/ (stable), api/io/, api/research/
          # and api/lowlatency/
          for m in core io research lowlatency; do
            dest=_site/api; [ "$m" != core ] && dest=_site/api/$m
            mkdir -p "$dest"
            if [ -d "$m/target/site/apidocs" ]; then
              cp -r "$m/target/site/apidocs/"* "$dest/"
            else
              cp -r "$m/target/reports/apidocs/"* "$dest/"
            fi
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
