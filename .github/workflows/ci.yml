name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow calls this whole workflow on the tagged commit and
  # publishes only if it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: verify (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['25']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Unit tests, the jacoco coverage gate and packaging. The load and
      # timing tags are skipped here and run in nightly.yml.
      - name: Build, test and check coverage
        run: ./mvnw -B --no-transfer-progress verify
      - name: Compile COOKBOOK recipes against the build
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check-cookbook.py
      - name: Coverage summary
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR>1 {missed+=$8; covered+=$9} END \
            {printf "Line coverage (%s): %.1f%% (%d/%d lines)\n", ENVIRON["RUNNER_OS"], 100*covered/(covered+missed), covered, covered+missed}' \
            target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            core/target/site/jacoco
            lowlatency/target/site/jacoco
          if-no-files-found: ignore

  api-compat:
    # Binary compatibility against the released 2.4.0 jar (japicmp). Fails on
    # an incompatible change in the stable module (docs/STABILITY.md) that is
    # not on the 3.0 allow-list in core/pom.xml; the low-latency module is
    # reported in api-lowlatency.html only.
    name: API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Fetch the 2.4.0 baseline jar
        run: bash scripts/fetch-api-baseline.sh 2.4.0
      - name: Compare against 2.4.0
        run: ./mvnw -B --no-transfer-progress -Papi-compat -DskipTests -Dmaven.javadoc.skip verify
      - name: Summary
        if: always() && hashFiles('core/target/japicmp/api-stable.md') != ''
        run: |
          {
            echo '## API changes in the stable module since 2.4.0'
            cat core/target/japicmp/api-stable.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-compat-report
          path: |
            core/target/japicmp
            lowlatency/target/japicmp
          if-no-files-found: ignore
