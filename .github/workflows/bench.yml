# Manual benchmark run on Linux (GitHub-hosted runner).
#
# HONESTY NOTE: shared runners are NOISY — no core isolation, unknown
# neighbors, frequency scaling. These numbers establish "runs on Linux" and
# rough magnitudes only. For real measurements use a dedicated box tuned per
# scripts/linux-tune.sh and docs/ULTRA_LOW_LATENCY.md.
name: Benchmarks (Linux)

on:
  workflow_dispatch:

# Recommended JDK 25 low-latency flags (docs/ULTRA_LOW_LATENCY.md section 8);
# each step adds a fixed heap (-Xms = -Xmx).
env:
  JVM_LOWLAT: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:+AlwaysPreTouch -XX:+PerfDisableSharedMem

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile
        run: ./mvnw -B --no-transfer-progress -DskipTests compile
      - name: HFT market data benchmark
        run: |
          {
            echo '## HFT market data benchmark (shared runner — indicative only)'
            echo '```'
            java -Xms1g -Xmx1g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.HftLatencyBenchmark
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HFT order path benchmark
        run: |
          {
            echo '## HFT order path benchmark (shared runner — indicative only)'
            echo '```'
            java -Xms1g -Xmx1g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.HftOrderBenchmark
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HFT quoter benchmark
        run: |
          {
            echo '## HFT quoter benchmark (shared runner — indicative only)'
            echo '```'
            java -Xms1g -Xmx1g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.HftQuoterBenchmark
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HFT matching engine benchmark
        run: |
          {
            echo '## HFT matching engine benchmark (shared runner — indicative only)'
            echo '```'
            java -Xms1g -Xmx1g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.HftBookBenchmark
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Scale benchmarks (symbols, crosses, shards)
        run: |
          {
            echo '## Scale benchmarks (shared runner — indicative only)'
            echo '```'
            java -Xms2g -Xmx2g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.ScaleBenchmark 100 2000000 0
            java -Xms2g -Xmx2g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.ScaleBenchmark 10000 1000000 0.0002
            java -Xms1g -Xmx1g $JVM_LOWLAT -cp core/target/classes:lowlatency/target/classes \
              com.quantfinlib.examples.ShardScaleBenchmark 2
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
