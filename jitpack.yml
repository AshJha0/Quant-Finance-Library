# JitPack builds the reactor from the root POM and publishes every installed
# module: com.github.AshJha0.Quant-Finance-Library:quant-finance-library and
# com.github.AshJha0.Quant-Finance-Library:quant-finance-library-lowlatency
# (plus the parent POM, which both reference). Since 3.0 the build has two
# modules; verify a JitPack build of a test tag before the release tag.
jdk:
  - openjdk25
install:
  - ./mvnw -B --no-transfer-progress -DskipTests install
