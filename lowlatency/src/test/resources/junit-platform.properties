# A hung socket or thread test fails after two minutes instead of stalling CI.
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.mode = enabled

# Test classes run in parallel; methods inside one class stay sequential, so a
# class that shares a server, a bus or a static fixture between methods is safe.
# Socket tests bind port 0 and no test changes global JVM state (checked by grep
# for fixed ports, System.setProperty/setOut and setDefault). A class that must
# run alone can opt out with @Execution(ExecutionMode.SAME_THREAD) plus
# @Isolated.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# jqwik: report only failing properties; fixed tries keep run time predictable.
jqwik.reporting.onlyfailures = true
jqwik.edgecases.default = MIXIN
jqwik.database = target/.jqwik-database
